# --- BITEMPORAL 1: transaction time (include_superseded) ----------------------
# The harness resolves expect_item_id to the LIVE chain head, so a superseded
# revision can be asserted ABSENT (forbid_item_id is never resolved) but not
# PRESENT by id. Live probe 2026-09-03 (kb_search, k=5, expand=false):
#   default:            473 (head), 24709, 30811, 24729, 1576 -- 101 absent
#   include_superseded: 101 (superseded -> 473) rank 1, 473 rank 3,
#                       21589 (superseded -> 24709) rank 4
- q: "mTLS fleet agent deferred config-sync"
  # Default search hides superseded revisions: the rm3 fleet-agent README
  # revision 101 (superseded by 473 on 2026-07-07) must never surface unasked.
  # forbid-only, so it never inflates hit@5 or MRR.
  forbid_item_id: 101
- q: "mTLS fleet agent deferred config-sync"
  # Transaction time: asked for, the superseded revision IS retrievable
  # (Invariant 5 -- everything stays retrievable WITH a flag). Today this can
  # only be asserted through the head (expect_item_id 101 resolves to 473, rank
  # 3 with the flag); E1 picks (a) an `expect_item_id_raw` criterion that skips
  # _chain_head (~4 harness lines) asserting 101 itself at rank <= 3, or (b) an
  # expect_substr unique to the old revision's body. Staged as (a).
  expect_item_id: 101            # E1: expect_item_id_raw: 101, expect_rank_le: 3
  kwargs: {include_superseded: true}

