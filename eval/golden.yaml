  expect_substr: ["PLATFORM-520"]
  expect_rank_le: 5
- q: "سسٹم ڈی سروس بار بار ری سٹارٹ ہو رہی ہے لاگ کیسے دیکھیں"
  # MULTILINGUAL #2. The existing Urdu case retrieves URDU content (Benin); this
