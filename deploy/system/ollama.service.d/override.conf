[Service]
# ONE model on the card at a time.
#
# Unset, Ollama takes its "fits alongside existing models" path: it predicted
# qwen3-embedding:0.6b at 833 MiB when it actually needs 2,261 MiB (1,209 MiB of
# that is a compute buffer layer-offload cannot shrink), launched it into the
# ~1.2 GiB beside the pinned 14B, and then either died on cudaMalloc or fell
# back to CPU IN SILENCE. Measured over 36h: 421 of 1,061 embedder loads ran
# with 0/29 layers on the GPU - 40% of all embedding at ~1.4s/chunk instead of
# ~10ms, with nothing in any log the KB reads.
#
# With one slot the concurrent-fit path is gone: every model loads onto a card
# holding only the rerank sidecar, so it either offloads fully or fails loudly.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Pin what is currently implicit. With the card emptier, auto-parallel could
# pick np=2 and double the 14B's KV cache (2,560 -> 5,120 MiB), pushing its
# prediction past the fit threshold and re-introducing silent partial offload -
# the exact failure being fixed.
Environment="OLLAMA_NUM_PARALLEL=1"
# The cuda_v13 runner Ollama picks on this driver (595, CUDA 13.2) ships PTX only -
# no sm_89 SASS - so the driver JIT-compiles the ggml-cuda kernels into the service
# user's ~/.nv/ComputeCache and every model load reads them back from there (2 s
# warm). The first loads after the 0.40.11 upgrade paid the JIT (qwen3:14b 36 s,
# then 3.6 s); the cache sat at 753 MB afterwards. A cache that overflows its cap
# re-JITs on loads, and the drain does ~40 loads a night - keep the cap far above
# the working set (driver default is reported as 1 GiB).
Environment="CUDA_CACHE_MAXSIZE=4294967296"
