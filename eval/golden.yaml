# --- GRAPH-EXPANSION A/B (kbworker.eval_sentinel._graph_expansion_ab) ---------
# PARKED 2026-08-09 (GRAPH_AB_ENABLED = False). When armed, the sentinel replays
# THIS set twice more — expansion forced OFF (hops=0) and ON (expand=true →
# max(KB_GRAPH_EXPAND_HOPS, 1)) — and reports eval_ab_off_* / eval_ab_on_* /
# eval_ab_delta_* as the evidence for (or against) raising KB_GRAPH_EXPAND_HOPS,
# overriding each case's own kwargs.expand on both sides so the two stay
# comparable.
#
# The delta is only as informative as its relation-ONLY cases: an item the
# lexical/vector legs already find scores the same on both sides and tells you
# nothing; only a case whose expected item is reachable ONLY over a relation edge
# from a strong lexical match (plus expect_rank_le so a demotion shows) moves it.
# The three staged fixtures in eval/golden.proposed.yaml could NOT be resolved on
# today's corpus — for each candidate query the strong seed's typed neighbours are
# already direct top-5 hits, superseded (expansion re-checks status), or
# nightly-regenerated summaries with unstable ids; expand=true lifts none of them
# into the top-5. With no informative case the A/B measured ~0 delta every night,
# so it is parked (reclaiming its two replays) rather than run empty. The
# mechanism stays covered by tests/test_eval_plumbing.py against a seeded kb_test
# corpus; re-arm by resolving real fixtures and flipping the one constant.

