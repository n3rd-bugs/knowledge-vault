<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Knowledge Vault{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {# Apply the persisted theme BEFORE first paint so dark mode never flashes. #}
  <script>(function(){try{var t=localStorage.getItem("kb-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
</head>
<body>
  <header class="site">
    <nav>
      <a class="brand" href="/">Knowledge Vault</a>
      <a href="/">search</a>
      <a href="/timeline">timeline</a>
      <a href="/projects">projects</a>
      <a href="/stats">stats</a>
    </nav>
    <div class="head-right">
      <span class="ro-note">read-only</span>
      <button id="theme-toggle" type="button" title="cycle theme">◐</button>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="/static/app.js" defer></script>
</body>
</html>
