# --- GRAPH-EXPANSION A/B (kbworker.eval_sentinel._graph_expansion_ab) ---------
# Every night the sentinel now replays THIS set twice more — once with expansion
# forced OFF (hops=0) and once ON (expand=true → max(KB_GRAPH_EXPAND_HOPS, 1)) —
# and reports eval_ab_off_* / eval_ab_on_* / eval_ab_delta_* in the consolidation
# report. That is the evidence for (or against) raising KB_GRAPH_EXPAND_HOPS, and
# it OVERRIDES each case's own kwargs.expand on both sides so the two numbers stay
# comparable.
#
# The delta is only as informative as the cases behind it. A case whose expected
# item is found by the lexical/vector legs anyway scores the same on both sides
# and tells you nothing; what moves the delta is a case whose expected item is
# reachable ONLY over a relation edge from a strong lexical match, plus
# expect_rank_le so a demotion is visible. This file's format supports exactly
# that (expect_item_id + expect_rank_le) but NOT fixtures — it pins LIVE item ids,
# which cannot be resolved from the repo — so such cases are staged, with the
# recipe for resolving them, in eval/golden.proposed.yaml. Move them here once the
# ids are filled in. tests/test_eval_plumbing.py exercises the same shape against
# a seeded kb_test corpus.

# --- promoted from golden.proposed.yaml 2026-08-04 (ids resolved live) -------
- q: "UART dropping bytes at high baud rate"
  # rank-sensitive twin of the expect_substr case above: 984 is the gotcha
  # itself; a slide below rank 3 is a ranking regression hit@5 cannot see.
  expect_item_id: 984
  expect_rank_le: 3
- q: "TPS55288 I2C output voltage"
  expect_substr: ["TPS55288"]
  # Guard: cross-domain leakage — the Urdu teaching item creeping into the
  # top-5 for a hardware identifier query (e.g. via graph expansion) must
  # fail loudly. forbid-only criteria never inflate hit@5.
  forbid_item_id: 987
  kwargs: {expand: true}
