[project]
name = "knowledge-vault"
version = "0.1.0"
description = "Local, model-agnostic knowledge library for multidomain software development (Knowledge Vault)."
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "watchdog>=4.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "tiktoken>=0.7",
  "zstandard>=0.22",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
kb = "kbcli.main:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbcore", "src/kbmcp", "src/kbworker", "src/kbcli", "src/kbrest", "src/kbweb"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer's and FastAPI's APIs are call-in-default by design
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
