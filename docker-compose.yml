services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kb-db
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [kbdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U kb"], interval: 5s, retries: 20}
    networks: [kbnet]

  # --- Phase 6: containerized HTTP services on kbnet, fronted by Traefik ---
  # They reach the (unchanged) db and host Ollama over host.docker.internal, so
  # kb-db is not recreated and the host systemd worker/consolidator are undisturbed.
  # KB_DB_URL/OLLAMA_URL/binds are overridden here; the rest comes from .env.
  kb-mcp:
    build: .
    image: kb-app:latest
    container_name: kb-mcp
    # journald like kb-mcp-public/kb-rest/kb-web (review #8 H15): json-file logs
    # die with the container, so a local-MCP incident vanished with its recreate.
    logging: {driver: journald}
    # Run as the HOST user. The raw archive is a shared filesystem between
    # these containers and the host worker; as root they created project
    # dirs root:root that the worker (uid 1000) then could not write into,
    # failing 9 extractions with PermissionError. kb-web already does this.
    user: "1000:1000"
    command: ["python", "-m", "kbmcp.server"]
    env_file: [.env]
    volumes:
      # The RAW ARCHIVE. sources.raw_path holds an ABSOLUTE host path, so a
      # container that cannot see it at the SAME path cannot read any raw
      # content: kb_read_raw, kb_describe_raw and every raw_ref anchor
      # validation failed for all 687 archived sources until this mount
      # existed. Read-WRITE because kb_put_doc archives through this path.
      - ${HOME}/kb/raw:/home/usama/kb/raw:rw
    environment:
      KB_DB_URL: postgresql://kb@db:5432/kb
      KB_RAW: /home/usama/kb/raw
      OLLAMA_URL: http://host.docker.internal:11434
      KB_BIND: 0.0.0.0
      KB_PORT: "8321"
      KB_ALLOW_ANY_BIND: "true"
      KB_WEB_ALLOWED_EMAILS: "mirzaon@gmail.com"  # owner promotion on any OAuth path (see kb-mcp-public)
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8321:8321"]   # keep the existing local Claude Code registration working
    networks: [kbnet]
    restart: unless-stopped

  # Public MCP instance: identical image, but OAuth-enabled (claude.ai web/mobile
  # connectors need OAuth, not a raw bearer) AND public-only (NDA allow-list — sees
  # only projects flagged public). No host port: reachable ONLY through Traefik/TLS.
  # MultiAuth still accepts the static bearer, so Claude Code can also use the URL.
  kb-mcp-public:
    image: kb-app:latest
    container_name: kb-mcp-public
    # 401/burst forensics must survive container recreation (review #6 Wave G):
    # json-file logs die with the container, which is how the 08-22 scan burst
    # vanished from its own 7-day window. journald persists on the host.
    logging: {driver: journald}
    # Run as the HOST user. The raw archive is a shared filesystem between
    # these containers and the host worker; as root they created project
    # dirs root:root that the worker (uid 1000) then could not write into,
    # failing 9 extractions with PermissionError. kb-web already does this.
    user: "1000:1000"
    command: ["python", "-m", "kbmcp.server"]
    env_file: [.env, oauth.env]   # oauth.env: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (gitignored)
    environment:
      KB_DB_URL: postgresql://kb@db:5432/kb
      KB_RAW: /home/usama/kb/raw
      OLLAMA_URL: http://host.docker.internal:11434
      KB_BIND: 0.0.0.0
      KB_PORT: "8321"
      KB_ALLOW_ANY_BIND: "true"
      # KB_PUBLIC_ONLY intentionally OFF: access is restricted to a single identity
      # (OAuth app in Testing mode → only the owner's Gmail can log in; the static
      # bearer is the owner's). Flip to "true" to re-enable the NDA allow-list.
      KB_OAUTH_ENABLED: "true"
      # Owner recognition on the OAuth/connector path (fix 2026-07-22): an
      # allowlisted Gmail is PROMOTED to the unrestricted OWNER. Without this the
      # owner's Google sign-in resolves to a NO-GRANT non-owner and every write
      # fails "project '…' is not writable with this credential" (the static
      # bearer path still worked; OAuth did not). Must match kb-web's value.
      KB_WEB_ALLOWED_EMAILS: "mirzaon@gmail.com"
      # Advertised OAuth issuer/endpoints MUST equal the public URL claude.ai uses.
      # claude.ai's broker refuses the non-standard :8803 port (ISP blocks inbound
      # 443), so the public front door is a Cloudflare Tunnel terminating at 443 on
      # kb.n3rd-bugs.dev; cloudflared (host systemd) forwards to the published port
      # below. Every issuer/PRM/redirect URL therefore renders as https://kb...dev.
      KB_PUBLIC_URL: "https://kb.n3rd-bugs.dev"
      # uid 1000 has no passwd entry in the image, so Path.home() has nothing to
      # resolve. FastMCP's OAuth proxy calls it to place its token store, so an
      # explicit writable HOME is required — see the volume note below.
      HOME: /home/app
    # FastMCP keeps OAuth state (claude.ai's client registration, refresh tokens,
    # upstream Google tokens) in an encrypted file store under this path. Without
    # a volume it is wiped on every redeploy -> POST /token 401 -> everyone is
    # logged out ("KB loses authentication quickly"). Encrypted at rest with a
    # key derived from the Google client secret, so persisting it is safe.
    volumes:
      # The RAW ARCHIVE. sources.raw_path holds an ABSOLUTE host path, so a
      # container that cannot see it at the SAME path cannot read any raw
      # content: kb_read_raw, kb_describe_raw and every raw_ref anchor
      # validation failed for all 687 archived sources until this mount
      # existed. Read-WRITE because kb_put_doc archives through this path.
      - ${HOME}/kb/raw:/home/usama/kb/raw:rw
      # Path MUST match HOME above. uid 1000 has no passwd entry, so Path.home()
      # resolved to / and mkdir('/.local') crash-looped the container 252 times
      # behind a 502 (2026-07-30). The fix is an explicit HOME, NOT a different
      # location: the store bakes ABSOLUTE paths into its own metadata, so moving
      # it to /home/app made every existing entry fail FastMCP's path-security
      # check ('Path /root/... is outside root /home/app/...') and broke the
      # claude.ai connector's saved registration. Keep /root and make it WRITABLE
      # by chowning the volume to 1000:1000 instead.
      - fastmcp-oauth:/home/app/.local/share/fastmcp
    # This IS the OAuth server: it calls Google server-side (OIDC discovery, JWKS,
    # and the auth-code -> token exchange at the callback). kbnet's embedded
    # resolver can't reach the internet, so give it public DNS (same as
    # kb-cloudflared/kb-traefik/kb-web) or the OAuth flow fails at the Google hop.
    dns: ["1.1.1.1", "8.8.8.8"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kbnet]
    restart: unless-stopped
    depends_on: [kb-mcp]   # reuse the built image

  # Cloudflare Tunnel = the public 443 front door for claude.ai. The ISP blocks
  # inbound 443 and claude.ai's connector broker refuses the non-standard :8803,
  # so cloudflared dials OUT to Cloudflare's edge, which serves
  # https://kb.n3rd-bugs.dev (edge TLS) and forwards to kb-mcp-public over kbnet
  # (tunnel ingress: kb.n3rd-bugs.dev -> http://kb-mcp-public:8321). No inbound
  # port, no Traefik in this path. TUNNEL_TOKEN (connector token) is gitignored.
  kb-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kb-cloudflared
    # journald (review #8 H15): the tunnel IS the public front door and the kill
    # switch, so its connect/disconnect forensics must outlive a recreate.
    logging: {driver: journald}
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: [cloudflared.env]
    dns: ["1.1.1.1", "8.8.8.8"]   # kbnet's embedded resolver can't reach argotunnel.com (same as kb-traefik)
    networks: [kbnet]
    restart: unless-stopped
    depends_on: [kb-mcp-public]

  kb-rest:
    image: kb-app:latest
    container_name: kb-rest
    # 401/burst forensics must survive container recreation (review #6 Wave G):
    # json-file logs die with the container, which is how the 08-22 scan burst
    # vanished from its own 7-day window. journald persists on the host.
    logging: {driver: journald}
    # Run as the HOST user. The raw archive is a shared filesystem between
    # these containers and the host worker; as root they created project
    # dirs root:root that the worker (uid 1000) then could not write into,
    # failing 9 extractions with PermissionError. kb-web already does this.
    user: "1000:1000"
    command: ["python", "-m", "kbrest.server"]
    env_file: [.env]
    volumes:
      # The RAW ARCHIVE. sources.raw_path holds an ABSOLUTE host path, so a
      # container that cannot see it at the SAME path cannot read any raw
      # content: kb_read_raw, kb_describe_raw and every raw_ref anchor
      # validation failed for all 687 archived sources until this mount
      # existed. Read-WRITE because kb_put_doc archives through this path.
      - ${HOME}/kb/raw:/home/usama/kb/raw:rw
    environment:
      KB_DB_URL: postgresql://kb@db:5432/kb
      KB_RAW: /home/usama/kb/raw
      OLLAMA_URL: http://host.docker.internal:11434
      KB_BIND: 0.0.0.0
      KB_REST_PORT: "8322"
      KB_ALLOW_ANY_BIND: "true"
      # CORS pin for the web UI's fetches: required here since the config default
      # became "" (review finding — without it, web-UI writes break on recreate).
      KB_WEB_PUBLIC_URL: "https://web.n3rd-bugs.dev"
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kbnet]
    restart: unless-stopped
    depends_on: [kb-mcp]   # reuse the built image

  kb-web:
    image: kb-app:latest
    container_name: kb-web
    # 401/burst forensics must survive container recreation (review #6 Wave G):
    # json-file logs die with the container, which is how the 08-22 scan burst
    # vanished from its own 7-day window. journald persists on the host.
    logging: {driver: journald}
    command: ["python", "-m", "kbweb.server"]
    env_file: [.env, oauth.env]   # oauth.env: GOOGLE_CLIENT_ID/SECRET for web "Sign in with Google"
    environment:
      KB_DB_URL: postgresql://kb@db:5432/kb
      KB_RAW: /home/usama/kb/raw
      OLLAMA_URL: http://host.docker.internal:11434
      KB_BIND: 0.0.0.0
      KB_WEB_PORT: "8323"
      KB_ALLOW_ANY_BIND: "true"
      # Public read-only UI, served on 443 via the Cloudflare Tunnel
      # (web.n3rd-bugs.dev -> kb-web:8323). Google login is gated by this
      # allowlist; the KB_TOKEN form login remains as an owner fallback.
      KB_WEB_PUBLIC_URL: "https://web.n3rd-bugs.dev"
      KB_WEB_ALLOWED_EMAILS: "mirzaon@gmail.com"
      # Owner-only web backup-setup surface (A11-3 backup carve-out). The paths
      # below are the CONTAINER side of the bind-mounts; the host backup scripts
      # read the same files under ~/kb/webconf. Mounted into kb-web ONLY (never
      # kb-mcp-public) per the 2026-07-21 security review.
      KB_OFFSITE_CONF: /config/offsite.env
      KB_RCLONE_CONF_DIR: /config/rclone
      KB_BACKUPS: /backups
    # Run as the host owner UID so files kb-web writes to /config are readable by
    # the host backup scripts (which run as usama). Without this, root-owned 0600
    # config/creds would be unreadable by the timer (2026-07-21 EBUSY+perms fix).
    user: "1000:1000"
    volumes:
      # RW: a DIRECTORY mount (not a single-file mount — os.replace can't rename
      # over a bind-mounted FILE: EBUSY). Holds the non-secret offsite config, the
      # email companion, and rclone/ (the Drive credential). The age PRIVATE key
      # is NEVER stored here (generate_age_keypair shows it once and discards it),
      # so a kb-web compromise yields only ENCRYPTED-backup Drive access. The host
      # SCRIPTS parse offsite.env with a strict allowlist (never `source` it).
      - ${HOME}/kb/webconf:/config:rw
      # RO: status display only — the web never writes backups.
      - ${HOME}/kb/backups:/backups:ro
    # Google sign-in makes outbound calls to oauth2.googleapis.com; kbnet's
    # embedded resolver can't reach the internet, so give it public DNS (same as
    # kb-cloudflared/kb-traefik). Without this the code exchange fails with
    # "Temporary failure in name resolution" -> "Google sign-in was not accepted".
    dns: ["1.1.1.1", "8.8.8.8"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kbnet]
    restart: unless-stopped
    depends_on: [kb-mcp]

  # kb-traefik (the :8803 host listener) was RETIRED 2026-07: the Cloudflare
  # Tunnel serves everything on standard 443 — kb.n3rd-bugs.dev (MCP),
  # web.n3rd-bugs.dev (UI), api.n3rd-bugs.dev (REST) — with edge TLS, so no
  # inbound port, no Let's Encrypt/Namecheap ACME to maintain. Kill switch is
  # now `docker compose stop kb-cloudflared`.

  # Self-hosted push for the Claude Code Stop hook. NOT ntfy.sh: the payload
  # carries the working directory (i.e. a CLIENT PROJECT NAME — aquamonix,
  # punchrescue), and publishing that to a third-party topic would leak NDA
  # metadata from a system that is otherwise private, tunneled and
  # single-identity. Self-hosting keeps the useful message and leaks nothing.
  #
  # DENY-ALL BY DEFAULT. ntfy is open to anyone by default and this is reachable
  # from the internet through the tunnel, so anonymous read AND write are off:
  # a topic name alone must never be enough to read your notifications or to
  # publish to them. Credentials live in ntfy.env (gitignored).
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: kb-ntfy
    command: ["serve"]
    env_file: [ntfy.env]
    environment:
      NTFY_BASE_URL: "https://ntfy.n3rd-bugs.dev"
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      # Web Push is what makes Chrome a real client with the tab closed.
      NTFY_WEB_PUSH_FILE: /var/lib/ntfy/webpush.db
      NTFY_WEB_PUSH_EMAIL_ADDRESS: "mirzaon@gmail.com"
    volumes:
      - ntfy-data:/var/lib/ntfy
    user: "1000:1000"
    networks: [kbnet]
    restart: unless-stopped

volumes:
  ntfy-data:
  kbdata:
  fastmcp-oauth:

networks:
  kbnet:
    name: kbnet
