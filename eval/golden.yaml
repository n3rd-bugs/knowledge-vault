# --- QUERY CLASSES WITH ZERO COVERAGE (added 2026-08-08) ---------------------
# Five classes the set never exercised. NONE of these is identifier-dominant —
# they measure the vector/keyword path, not the leg above — and the bound is
# again observed rank + 2. Same provenance rule: ranks observed live
# 2026-08-08 via kb_search, k=5, expand unset (hops 0).

- q: "service dies at boot but starts fine manually afterwards"
