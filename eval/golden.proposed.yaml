# eval/golden.proposed.yaml — PROPOSED golden cases pending OWNER approval.
# NOT loaded by the eval (load_golden reads golden.yaml only). These cases pin
# LIVE item ids, which cannot be resolved from the repo: look each title up in
# the live corpus (`kb search "<title>"` → id), replace the 0 placeholders,
# then move the case into eval/golden.yaml. `kb eval mine` emits more
# candidates in exactly this shape from real search→kb_get usage.

- q: "UART dropping bytes at high baud rate"
  # FIXME: live id of "UART RX drops bytes at 115200 baud during PWM bursts"
  expect_item_id: 0
  expect_rank_le: 3

- q: "TPS55288 I2C output voltage"
  expect_substr: ["TPS55288"]
  # FIXME: live id of "بینن کی سلطنت — سبق کے نوٹس (Kingdom of Benin lesson notes)"
  # Guard: cross-domain leakage — an unrelated teaching item creeping into the
  # top-5 for a hardware identifier query (e.g. via graph expansion) must fail.
  forbid_item_id: 0
  kwargs: {expand: true}

# =============================================================================
# GRAPH-EXPANSION A/B FIXTURES — rank-sensitive, relation-reachable cases.
#
# WHY. The nightly sentinel now runs the golden set with expansion OFF and ON and
# reports the delta (eval_ab_delta_hit_at_5 / _mrr), so the owner can decide from
# THIS corpus whether the >20k curated relation edges earn a non-zero
# KB_GRAPH_EXPAND_HOPS. Cases whose answer the lexical/vector legs already find
# score identically on both sides and contribute nothing to that delta. These
# three are the shape that does move it: the expected item is reachable only over
# a relation EDGE from a strong lexical match, and expect_rank_le makes a
# demotion visible (plain hit@5 sees found/not-found and nothing else).
#
# HOW TO RESOLVE THE IDS (this file is never loaded by the eval; golden.yaml is):
#   1. Pick a query Q that already retrieves well:  kb search "<Q>"
#      → note the rank-1 item S (the strong lexical match / "seed").
#   2. List S's relation neighbours:  kb trace <S> --depth 1
#      → pick a neighbour T on a real typed edge (fixes / depends_on / part_of /
#        derived_from — NOT a 'mentions' entity edge; expansion skips those).
#   3. Confirm T is NOT already retrievable for Q:  kb search "<Q>" | grep <T>
#      must find nothing in the top-5. If it does, T is a direct hit and the case
#      measures nothing — pick another neighbour.
#   4. Replace the 0 placeholders below with T's id, uncomment, and move the case
#      into eval/golden.yaml.
#   5. Sanity-check the pair before trusting it: `make eval` (hops default 0) must
#      FAIL the case, and the sentinel's ON side must pass it. That contrast IS
#      the measurement.
#
# Keep these SMALL in number. Each one is deliberately unreachable without
# expansion, so with the shipped hops=0 default it fails nightly and drags the
# headline hit@5 down toward the KB_EVAL_MIN_HIT5 floor. Two or three is enough
# signal; a dozen would turn the regression sentinel into a false alarm.
# =============================================================================

