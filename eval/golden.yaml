  # 2026-08-08: rank 1 = 10255 ("...:502 for standard Modbus TCP, while :516 is
  # reserved for an encrypted protocol that isn't currently supported").
  expect_substr: [":516"]
  expect_rank_le: 3
- q: "have we hit a websocket authentication bypass anywhere"
  # CROSS-PROJECT "have we solved X anywhere" with a NON-DILUTED target — the
  # control for the known-red canary above. Same vague shape, but the target is
  # UNAMBIGUOUS: "PLATFORM-520" occurs in exactly one item — 371, project bss,
  # verified, the general LESSON — so no amount of near-twin mass can satisfy
  # this case by accident, and reaching it means crossing from the project that
  # owns the topic (bridgesecuritysolution) into another one. Green today: if it
  # goes red, vague cross-project recall has degraded generally, not just for
  # the canary's "sp" collision.
  # 2026-08-08: rank 3 = 371. Ranks 1-2 (10447, 10411) are the
  # bridgesecuritysolution repro/bug twins and do NOT carry the ticket id
