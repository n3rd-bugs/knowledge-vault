{% extends "base.html" %}
{% block title %}Sign in · Knowledge Vault{% endblock %}
{% block content %}
<div class="card" style="max-width: 26rem; margin: 3rem auto;">
  <h2 style="margin-top:.2rem">Sign in</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="bar">
    <input type="password" name="token" placeholder="bearer token" autofocus>
    <button type="submit">Sign in</button>
  </form>
  <p><a href="/auth/google/login">Sign in with Google</a></p>
  <p class="prov">Read-only access. The token is your KB_TOKEN; Google sign-in is limited
    to allow-listed accounts.</p>
</div>
{% endblock %}
