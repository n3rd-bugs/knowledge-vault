  # top-5 for a hardware identifier query (e.g. via graph expansion) must
  # fail loudly. forbid-only criteria never inflate hit@5.
  forbid_item_id: 987
  kwargs: {expand: true}

# --- IDENTIFIER-LEG COVERAGE (added 2026-08-08) ------------------------------
# WHY. kbcore.search_legs arms the identifier leg only for identifier-DOMINANT
# queries — `_id_dominant`: at least HALF the query's words must be identifier
# tokens (digit or underscore anywhere, an all-caps acronym, or an internal
# capital). Before this block only 6 of 37 cases cleared that bar, and those 6
# were repeats of just TWO seed artefacts — motor-ctl's drv_spi_write and the
# TPS55288 decision (docx-tools' "PageNumber CURRENT field node docx footer"
# reads like a symbol query but is NOT dominant: 2 identifiers in 6 words, so
# the leg stays off there too). The leg — and its word-PREFIX fallback,
# and the exact-identifier bonus that rides on the same token list — was
# therefore unmeasured against the REAL corpus: a regression in it could only
# be seen through hardware seeds that never change.
#
# Each case below is identifier-dominant (its token list is quoted in the
# comment, reproducible with `_identifier_tokens` / `_id_dominant`) and targets
# a project the leg had never fired for. Ranks are LIVE ranks observed via
# kb_search on 2026-08-08 with k=5 and expand unset (hops 0) — exactly what
# `make eval` replays — so every case is green on day one. Each bound is the
# observed rank + 2: real slippage is visible, one night's consolidation churn
# is not. Substrings are the SYMBOL itself, so a near-miss that returns the
# right topic without the right artefact cannot pass.

- q: "SungrowModbusTcpClient GET_KEY handshake"
  # sungrow (1098 items, zero golden coverage). tokens
  # [SungrowModbusTcpClient, GET_KEY] of 3 words → leg armed.
  # 2026-08-08: rank 1 = 1076 (Sungrow Client Handshake Issue); 10258, 10250,
  # 10257, 10678 fill out the top-5 and all name the class, so this tracks a
  # near-twin FAMILY, not one id that a re-capture could move (cf. 858/488).
  expect_substr: ["SungrowModbusTcpClient"]
  expect_rank_le: 3
- q: "RF_PROFILE COMPAT FCC_STRICT rollout"
  # repeater (2659 items). tokens [RF_PROFILE, COMPAT, FCC_STRICT] of 4 → armed.
  # 2026-08-08: rank 1 = 2644 (decision, FCC_STRICT in the title); 15886, 16003,
  # 2634, 304 follow — the whole top-5 is the RF_PROFILE decision family.
  expect_substr: ["FCC_STRICT"]
  expect_rank_le: 3
- q: "lr11xx_radio_set_tx_params SF9 BW500"
  # punchrescue. tokens [lr11xx_radio_set_tx_params, SF9, BW500] of 3 → armed.
  # 2026-08-08: rank 2 = 3633 (the firmware change naming the symbol). Rank 1
  # (repeater 14728) describes the SAME change in prose — "the LR11XX radio
  # configuration" — so the underscored substring deliberately skips it: this
  # case measures symbol-exact retrieval, not topic retrieval.
  expect_substr: ["lr11xx_radio_set_tx_params"]
  expect_rank_le: 4
- q: "dwc2 TX FIFO flush timeout"
  # kvm (778 items). tokens [dwc2, TX, FIFO] of 5 words → armed (3*2 >= 5).
  # 2026-08-08: rank 1 = 15466 (dwc2 TX-FIFO wedge requires full module
